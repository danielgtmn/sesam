# Pull request titles must follow Conventional Commits (the required check
# "commits", see .github/workflows/commits.yml), so updates are "chore(deps): ...".
# chore does not make a release by itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories: [/, /internal/v1compat]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-modules:
        patterns: ["*"]
