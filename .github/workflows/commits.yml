# Checks that a pull request title follows Conventional Commits
# ("feat: ...", "fix(password): ...", see scripts/commit-type.sh). The job name
# "commits" is a required status check in the branch rules; renaming it means
# updating the rules as well.
#
# Stable versions are computed from the commit messages on release (see
# release.yml), and pull requests are merged with merge commits, so every
# commit of a pull request into main must follow the format too. Pull requests
# into release only warn (they carry older history) and report which release
# the merge will make.
#
# A separate workflow from ci.yml so that editing a title re-runs only this
# check. Merge queue runs skip it (a skipped job counts as passed).
name: Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if level=$(scripts/commit-type.sh "$TITLE"); then
            echo "Title OK, change level: $level"
          else
            echo "::error title=Pull request title::Rename the pull request to follow Conventional Commits, e.g. \"feat: add a passkey plugin\" or \"fix(password): keep the session on change\"."
            exit 1
          fi

      - name: Check the commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          rank() { case $1 in major) echo 3 ;; minor) echo 2 ;; patch) echo 1 ;; *) echo 0 ;; esac; }
          highest=none
          bad=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if level=$(scripts/commit-type.sh "$subject" "$(git log -1 --format=%b "$sha")" 2>/dev/null); then
              echo "${sha::7} $level  $subject"
              if [ "$(rank "$level")" -gt "$(rank "$highest")" ]; then highest=$level; fi
            elif [ "$BASE_REF" = release ]; then
              echo "::warning title=Commit ${sha::7}::\"$subject\" does not follow Conventional Commits and does not count for the version."
            else
              echo "::error title=Commit ${sha::7}::\"$subject\" does not follow Conventional Commits. Reword it (git rebase -i) to e.g. \"fix(password): keep the session on change\"."
              bad=1
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          if [ "$BASE_REF" = release ] && [ "$highest" = none ]; then
            msg="Merging this pull request releases nothing: no feat:, fix: or perf: commits."
          elif [ "$BASE_REF" = release ]; then
            msg="Merging this pull request makes a $highest release."
          else
            msg="Highest change level of these commits: $highest."
          fi
          echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$bad"
