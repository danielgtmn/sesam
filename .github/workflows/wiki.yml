# Copies wiki/ to the repository's GitHub wiki, so documentation is edited
# and reviewed like code. The wiki must exist once (create any page in the
# Wiki tab) before the first run.
name: Wiki

on:
  push:
    branches: [main]
    paths: ["wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy wiki/ to the GitHub wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$REF" "https://x-access-token:${TOKEN}@github.com/${REPO}.git" src
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki; then
            echo "::error::The wiki does not exist yet. Open the Wiki tab of the repository, create any page, then run this workflow again."
            exit 1
          fi
          rsync -a --delete --exclude .git src/wiki/ wiki/
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync from ${REPO}@${SHA::7}"
          git push
